<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shamba Weather Planner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-success">
    <div class="container">
      <span class="navbar-brand">🌾 Shamba Planner</span>
      <div>
        <button id="showWeather" class="btn btn-light btn-sm">Weather</button>
        <button id="showNotes" class="btn btn-outline-light btn-sm">Farm Log</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div id="message"></div>

   
    <section id="weatherSection">
        <div class="hero">
        <h1>Plan your farm work around the weather</h1>

        <p>Check the forecast for any town, get simple farming advice, and keep a log of what you did.
        </p>
      <form id="searchForm" class="row g-2 my-3">
        <div class="col-md-4">
          <label for="townSelect" class="form-label">Pick a town</label>
          <select id="townSelect" class="form-select">
           <option value="Nairobi,KE">Nairobi, Kenya</option>
          <option value="Nakuru,KE" selected>Nakuru, Kenya</option>
          <option value="Kisumu,KE">Kisumu, Kenya</option>
          <option value="Kampala,UG">Kampala, Uganda</option>
          <option value="Lagos,NG">Lagos, Nigeria</option>
          <option value="Kumasi,GH">Kumasi, Ghana</option>
          <option value="Pune,IN">Pune, India</option>
          <option value="Des Moines,US">Des Moines, USA</option>
          <option value="Cordoba,AR">Cordoba, Argentina</option>
          <option value="Lyon,FR">Lyon, France</option>       
          </select>
        </div>
        <div class="col-md-8">
          <label for="townInput" class="form-label">Or search another town</label>
          <div class="input-group">
            <input id="townInput" class="form-control" placeholder="e.g. Kericho,KE">
            <button class="btn btn-success">Search</button>
          </div>
        </div>
    </form>
            <div id="weatherResult"></div>
            <button id="addNoteBtn" class="btn btn-success mt-3" hidden>Add a note for this town</button>
    </section>
   
    <section id="notesSection" hidden>
      <h1 class="h3">Farm log</h1>
      
      <p class="text-muted">Write down what you did. Each note remembers the weather at that moment.</p>

      <form id="noteForm" class="card card-body mb-4">
        <div class="row g-2">
          <div class="col-md-4">
            <label for="noteTown" class="form-label">Town</label>
            <input id="noteTown" class="form-control">
          </div>
          <div class="col-md-4">
            <label for="noteCrop" class="form-label">Crop</label>
            <input id="noteCrop" class="form-control" placeholder="e.g. Maize">
          </div>
          <div class="col-md-4">
            <label for="noteActivity" class="form-label">Activity</label>
            <select id="noteActivity" class="form-select">
              <option>Planting</option>
              <option>Weeding</option>
              <option>Spraying</option>
              <option>Fertilizing</option>
              <option>Irrigating</option>
              <option>Harvesting</option>
            </select>
          </div>
        </div>
        <label for="noteComment" class="form-label mt-2">Note</label>
        <textarea id="noteComment" class="form-control" rows="3" placeholder="e.g. Planted the north plot"></textarea>
        <button class="btn btn-success mt-3">Save note</button>
      </form>

      <h2 class="h5">Saved notes</h2>
      <ul id="notesList" class="list-group"></ul>
    </section>
  </div>

  <script src="planner.js"></script>
  <footer class="bg-success text-light py-3">
  <div class="container text-center">
    &copy; 2026 Shamba Weather Planner
  </footer>
</body>
  </div>
</html>
